# Builds the Vanta OS image (image/Containerfile), pushes it to GHCR as :stable and
# :<version>, and signs it with keyless cosign (GitHub's OIDC identity, no stored key).
# Runs when the image, shell or brand change, weekly for Bazzite's updates, and by hand.
name: Build image

on:
  push:
    branches: [main]
    paths:
      - image/**
      - shell/**
      - brand/**
      - .github/workflows/build-image.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: build-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vanta-os
  REGISTRY_AUTH_FILE: /home/runner/.docker/config.json

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      # The base image is about 13 GB and the build stage adds a Rust and Qt toolchain.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          sudo mkdir -p /mnt/containers
          sudo chown "$USER" /mnt/containers
          mkdir -p ~/.config/containers ~/.docker
          printf '[storage]\ndriver = "overlay"\ngraphroot = "/mnt/containers"\n' > ~/.config/containers/storage.conf
          df -h / /mnt

      - uses: actions/checkout@v4

      - name: Build
        run: |
          VERSION="0.1.0-$(date -u +%Y%m%d)"
          podman build -f image/Containerfile \
            --build-arg VANTA_VERSION="$VERSION" \
            --build-arg VANTA_IMAGE_REF="$IMAGE" \
            -t "$IMAGE:stable" -t "$IMAGE:$VERSION" .
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push --digestfile digest "$IMAGE:stable"
          podman push "$IMAGE:$VERSION"
          echo "DIGEST=$(cat digest)" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@v3

      - name: Sign
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "$IMAGE@$DIGEST"
