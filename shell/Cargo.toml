[package]
name = "vanta-shell"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The Vanta OS console shell: home, library and settings, shown fullscreen in gamescope."
publish = false

[dependencies]
cxx = "1.0.176"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["full"] }
gilrs = "0.11"
qrcode = { version = "0.14", default-features = false }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10.0"

[profile.release]
lto = "thin"
strip = true
